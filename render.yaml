# Render "Blueprint": tells Render how to create the backend web service and its Postgres database.
# Use it with: Render dashboard > New > Blueprint > pick your GitHub repo.
services:
  - type: web
    name: digi-karigari-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true # Render makes a random secret for you
      - key: DATABASE_URL
        fromDatabase:
          name: digi-karigari-db
          property: connectionString
      - key: AUTO_SEED
        value: "true"
      # IMPORTANT: after your first Vercel deploy, set this to your real Vercel address, e.g.
      # https://digi-karigari.vercel.app  (no trailing slash). You can edit it in the Render dashboard.
      - key: CORS_ORIGINS
        value: http://localhost:5173
      # Lets any *.vercel.app address (including preview URLs) call the API.
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: AI_PROVIDER
        value: mock
      # To use the real AI: set AI_PROVIDER=gemini and add GEMINI_API_KEY in the dashboard.
      - key: GEMINI_API_KEY
        sync: false # you type this in the Render dashboard; it is never stored in git
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ANTHROPIC_API_KEY
        sync: false # only needed if you choose AI_PROVIDER=anthropic

databases:
  - name: digi-karigari-db
    plan: free
