<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digi-Karigari | कार्यकरी - Artisan Marketplace</title>
    <!-- Root-level CSS stylesheets -->
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/buyer.css">
    <link rel="stylesheet" href="assets/css/seller.css">
</head>
<body>
    <!-- Top Navigation Header -->
    <header class="marketplace-header">
        <div class="brand">
            <h1>Digi-Karigari <span>| कार्यकरी</span></h1>
        </div>

        <div class="location-badge" onclick="openLocationModal()">
            <span class="icon">📍</span>
            <div class="location-info">
                <small>Deliver to</small>
                <strong id="user-location-text">Select your location</strong>
            </div>
        </div>

        <nav class="nav-links">
            <a href="#marketplace" class="nav-link active" onclick="switchView('marketplace')">Marketplace</a>
            <a href="#seller" class="nav-link" onclick="switchView('seller')">Seller Portal</a>
            <a href="#impact" class="nav-link" onclick="switchView('impact')">Impact</a>
        </nav>

        <div class="buyer-auth-container">
            <div id="buyer-logged-out">
                <button class="secondary-btn" onclick="openBuyerAuthModal()">Log In / Sign Up</button>
            </div>
            <div id="buyer-logged-in" style="display: none;">
                <span id="buyer-name-display">👋 Welcome</span>
                <button class="text-link" onclick="handleBuyerLogout()">Logout</button>
            </div>
        </div>
    </header>

    <!-- Main Dynamic View Container -->
    <main id="main-content" class="main-container">
        <!-- Default content loaded dynamically by router/app.js -->
    </main>

    <!-- LOCATION PROMPT MODAL -->
    <div id="location-modal" class="modal-backdrop" style="display: none;">
        <div class="modal-card">
            <button class="close-btn" onclick="closeLocationModal()">&times;</button>
            <h3>Choose Delivery Location</h3>
            <p class="subtitle">Enter your PIN code or city to check artisan delivery availability</p>
            <div class="input-group">
                <label>City or 6-digit PIN Code</label>
                <input type="text" id="location-input" placeholder="e.g., 110001 or New Delhi" maxlength="30">
            </div>
            <button class="primary-btn" onclick="saveLocation()">Set Location</button>
        </div>
    </div>

    <!-- BUYER AUTHENTICATION MODAL -->
    <div id="buyer-auth-modal" class="modal-backdrop" style="display: none;">
        <div class="modal-card">
            <button class="close-btn" onclick="closeBuyerAuthModal()">&times;</button>
            <h3>Buyer Sign In / Sign Up</h3>
            <p class="subtitle">Log in to purchase directly from verified rural artisans</p>
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="switchBuyerAuthTab('mobile')">Mobile Number</button>
                <button class="tab-btn" onclick="switchBuyerAuthTab('google')">Google Email</button>
            </div>
            <div id="buyer-mobile-form" class="auth-form-panel">
                <div class="input-group">
                    <label>Mobile Number (+91)</label>
                    <input type="tel" id="buyer-mobile-input" placeholder="Enter 10-digit mobile number" maxlength="10">
                </div>
                <button class="primary-btn" onclick="handleBuyerMobileLogin()">Continue with Mobile</button>
            </div>
            <div id="buyer-google-form" class="auth-form-panel" style="display: none;">
                <button class="google-btn" onclick="handleBuyerGoogleLogin()">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"> 
                    Continue with Google
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
